<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Redirecting...</title>
    <script>
      // Redirect to the base path where React Router can handle the route
      const path = window.location.pathname;
      const base = "/se_project_react/";
      // Preserve the path after the base (e.g., /profile) and redirect
      const newPath = base + path.replace(base, "");
      window.location.href = newPath || base;
    </script>
  </head>
  <body>
    <p>Redirecting to the app...</p>
  </body>
</html>
